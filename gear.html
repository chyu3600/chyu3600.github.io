<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>齒輪參數計算</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff;padding:24px 16px;max-width:560px;margin:0 auto;color:#111}
.back{display:inline-block;margin-bottom:14px;color:#2563ff;text-decoration:none;font-size:16px}
h1{font-size:26px;text-align:center;margin-bottom:8px}
.note{font-size:13px;color:#888;text-align:center;margin-bottom:22px}
.card{background:#f5f7fa;border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;font-size:14px;color:#555;margin:14px 0 6px}
input{width:100%;padding:12px;border:1.5px solid #d8dde5;border-radius:10px;font-size:17px;background:#fff}
input:focus{outline:none;border-color:#2563ff}
button{width:100%;margin-top:20px;padding:15px;background:#2563ff;color:#fff;border:none;border-radius:12px;font-size:18px;cursor:pointer}
button:active{background:#1d4ed8}
table{width:100%;border-collapse:collapse;margin-top:16px;display:none}
table.show{display:table}
td{padding:10px 8px;border-bottom:1px solid #e5e9f0;font-size:15px}
td:first-child{color:#555}
td:last-child{text-align:right;font-weight:bold;color:#2563ff;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回首頁</a>
<h1>⚙️ 齒輪參數計算</h1>
<div class="note">標準直齒圓柱齒輪 · 壓力角 20°（GB / JIS 標準）</div>

<div class="card">
<label>模數 m（mm）</label><input type="number" id="m" inputmode="decimal" placeholder="例如 2">
<label>齒數 z₁</label><input type="number" id="z1" inputmode="numeric" placeholder="例如 24">
<label>配對齒數 z₂（選填，算中心距）</label><input type="number" id="z2" inputmode="numeric" placeholder="例如 60">
<button onclick="calc()">計算</button>
</div>

<table id="out">
<tr><td>節圓直徑 d = m·z₁</td><td id="r_d">—</td></tr>
<tr><td>齒頂圓直徑 dₐ = m(z₁+2)</td><td id="r_da">—</td></tr>
<tr><td>齒根圓直徑 d_f = m(z₁−2.5)</td><td id="r_df">—</td></tr>
<tr><td>基圓直徑 d_b = d·cos20°</td><td id="r_db">—</td></tr>
<tr><td>圓周齒距 p = π·m</td><td id="r_p">—</td></tr>
<tr><td>齒厚 s = π·m / 2</td><td id="r_s">—</td></tr>
<tr><td>中心距 a = m(z₁+z₂)/2</td><td id="r_a">—</td></tr>
</table>

<script>
function calc(){
var m=parseFloat(document.getElementById('m').value);
var z1=parseInt(document.getElementById('z1').value);
var z2=parseInt(document.getElementById('z2').value);
if(!m||m<=0||!z1||z1<5){alert('請填入模數與齒數（z ≥ 5 較合理）');return;}
var d=m*z1;
document.getElementById('r_d').textContent=d.toFixed(3)+' mm';
document.getElementById('r_da').textContent=(m*(z1+2)).toFixed(3)+' mm';
document.getElementById('r_df').textContent=(m*(z1-2.5)).toFixed(3)+' mm';
document.getElementById('r_db').textContent=(d*Math.cos(20*Math.PI/180)).toFixed(3)+' mm';
document.getElementById('r_p').textContent=(Math.PI*m).toFixed(3)+' mm';
document.getElementById('r_s').textContent=(Math.PI*m/2).toFixed(3)+' mm';
if(z2&&z2>=5){
document.getElementById('r_a').textContent=(m*(z1+z2)/2).toFixed(3)+' mm';
}else{
document.getElementById('r_a').textContent='（未填 z₂）';
}
document.getElementById('out').classList.add('show');
document.getElementById('out').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
