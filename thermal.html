<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金屬熱脹冷縮計算器</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{padding:16px;background:#f5f7fa;color:#222;transition: background 0.3s, color 0.3s;}
.container{max-width:600px;margin:0 auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px #00000015;transition: background 0.3s;}
h2{text-align:center;margin-bottom:20px;font-size:20px}
.item{margin-bottom:14px}
label{display:block;margin-bottom:6px;font-weight:500}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;transition:background 0.3s,color 0.3s;}
.btn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:8px;cursor:pointer}
.btn-toggle{background:#6b7280;margin-bottom:12px}
.result{margin-top:18px;padding:14px;background:#f0f4ff;border-radius:8px;white-space:pre-line;font-size:15px;line-height:1.6;transition: background 0.3s;}

/* 深色模式 */
body.dark{background:#1a1a2e;color:#eee}
body.dark .container{background:#27293d}
body.dark .result{background:#2f3354}
body.dark input,body.dark select{background:#373a50;color:#eee;border-color:#555}
</style>
</head>
<body>
<div class="container">
<button class="btn btn-toggle" onclick="toggleDark()">切換日夜模式</button>
<h2>金屬熱脹冷縮計算器</h2>

<div class="item">
<label>材質</label>
<select id="mat">
<option value="11.5e-6">碳鋼 / 模具鋼 α=11.5e‑6 /℃</option>
<option value="23e-6">鋁合金 α=23e‑6 /℃</option>
<option value="17e-6">銅 α=17e‑6 /℃</option>
<option value="8.6e-6">鈦合金 α=8.6e‑6 /℃</option>
<option value="5e-6">鎢鋼(硬質合金) α=5e‑6 /℃</option>
</select>
</div>

<div class="item">
<label>高溫時外徑 D_high (mm)</label>
<input type="number" step="0.0001" id="dHigh" placeholder="例如 28" value="28">
</div>

<div class="item">
<label>高溫時內徑 d_high (mm)</label>
<input type="number" step="0.0001" id="innerHigh" placeholder="例如19.5" value="19.5">
</div>

<div class="item">
<label>高溫溫度 T_high (℃)</label>
<input type="number" step="0.1" id="tHigh" placeholder="例如180" value="180">
</div>

<div class="item">
<label>目標常溫 T_low (℃)</label>
<input type="number" step="0.1" id="tLow" placeholder="例如29" value="29">
</div>

<button class="btn" onclick="calc()">開始計算</button>
<div class="result" id="res"></div>
</div>

<script>
//日夜切換
function toggleDark(){
  document.body.classList.toggle('dark');
}

function calc(){
  const alpha = parseFloat(document.getElementById('mat').value);
  const dHigh = parseFloat(document.getElementById('dHigh').value);
  const innerHigh = parseFloat(document.getElementById('innerHigh').value);
  const tHigh = parseFloat(document.getElementById('tHigh').value);
  const tLow = parseFloat(document.getElementById('tLow').value);

  if(isNaN(dHigh)||isNaN(innerHigh)||isNaN(tHigh)||isNaN(tLow)){
    document.getElementById('res').innerText="請輸入有效數字";
    return;
  }

  const dt = tLow - tHigh;
  const dDelta = dHigh * alpha * dt;
  const dLow = dHigh + dDelta;

  const innerDelta = innerHigh * alpha * dt;
  const innerLow = innerHigh + innerDelta;

  let txt = `【高溫狀態】\n`;
  txt += `高溫外徑：${dHigh} mm\n`;
  txt += `高溫內徑：${innerHigh} mm\n`;
  txt += `高溫溫度：${tHigh} ℃\n\n`;

  txt += `【冷卻到常溫】\n`;
  txt += `目標常溫：${tLow} ℃\n`;
  txt += `溫度總變化 ΔT：${dt.toFixed(1)} ℃\n\n`;

  txt += `外徑變化ΔD：${dDelta.toFixed(6)} mm\n`;
  txt += `冷卻後外徑：${dLow.toFixed(6)} mm\n\n`;

  txt += `內徑變化Δd：${innerDelta.toFixed(6)} mm\n`;
  txt += `冷卻後內徑：${innerLow.toFixed(6)} mm\n\n`;

  if(dt<0){
    txt += `👉從${tHigh}℃降溫到${tLow}℃，外徑收縮 ${Math.abs(dDelta).toFixed(6)} mm，內孔同步收縮 ${Math.abs(innerDelta).toFixed(6)} mm`;
  }else{
    txt += `👉從${tHigh}℃升溫到${tLow}℃，外徑膨脹 ${dDelta.toFixed(6)} mm，內孔同步膨脹 ${innerDelta.toFixed(6)} mm`;
  }

  document.getElementById('res').innerText = txt;
}

calc();
</script>
</body>
</html>
