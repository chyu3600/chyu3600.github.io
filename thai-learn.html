<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟังแล้วเรียน — 邊聽邊學</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffdf8;
      --line: #d9cbb0;
      --text: #1f2430;
      --muted: #5c6573;
      --th: #0b5c3a;
      --zh: #0b3d5c;
      --btn: #c9a227;
      --btn-text: #1a1200;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans Thai", "Noto Sans TC", "Sarabun", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    header { margin-bottom: 16px; }
    h1 { font-size: 22px; }
    header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }
    .cats button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .cats button.on {
      background: var(--btn);
      border-color: var(--btn);
      color: var(--btn-text);
      font-weight: 700;
    }
    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .th {
      font-size: 22px;
      font-weight: 700;
      color: var(--th);
      line-height: 1.4;
    }
    .zh {
      font-size: 15px;
      color: var(--zh);
      margin: 4px 0 10px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button.speak {
      border: 0;
      background: var(--th);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button.speak.zhbtn { background: var(--zh); }
    button.speak.both { background: #7a4e00; }
    .now {
      position: sticky;
      bottom: 12px;
      background: #1c2430;
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ฟังแล้วเรียน / 邊聽邊學</h1>
      <p>กดปุ่มเพื่อฟังภาษาไทยหรือภาษาจีน · 點按鈕聽泰文或中文</p>
    </header>
    <div class="cats" id="cats"></div>
    <div id="list"></div>
    <div class="now" id="now"></div>
  </div>
  <script>
    const DATA = {
      "ทักทาย / 打招呼": [
        ["สวัสดีครับ", "你好（男）"],
        ["สวัสดีค่ะ", "你好（女）"],
        ["ขอบคุณครับ", "謝謝（男）"],
        ["ขอบคุณค่ะ", "謝謝（女）"],
        ["ขอโทษครับ", "對不起"],
        ["ครับ / ค่ะ", "是的 / 好的"],
        ["ไม่เป็นไร", "沒關係"],
        ["ลาก่อน", "再見"]
      ],
      "โรงงาน / 工廠": [
        ["ไปทำงาน", "去上班"],
        ["เลิกงาน", "下班"],
        ["เข้างานตรงเวลา", "準時上班"],
        ["หัวหน้างาน", "主管"],
        ["เพื่อนร่วมงาน", "同事"],
        ["ห้องน้ำอยู่ที่ไหน", "廁所在哪裡"],
        ["โรงอาหาร", "餐廳"],
        ["พักเบรก", "休息"]
      ],
      "ความปลอดภัย / 安全": [
        ["สวมหมวกนิรภัย", "戴安全帽"],
        ["สวมรองเท้าเซฟตี้", "穿安全鞋"],
        ["ระวังร้อน", "小心燙"],
        ["ระวังหนีบ", "小心夾手"],
        ["หยุดเครื่อง", "停機"],
        ["เหตุฉุกเฉิน", "緊急狀況"],
        ["ปฐมพยาบาล", "急救"],
        ["ทางหนีไฟ", "逃生通道"]
      ],
      "งานตีเหล็ก / 鍛造": [
        ["เหล็ก", "鋼"],
        ["เหล็กกล้าคาร์บอน", "碳鋼"],
        ["เส้นผ่านศูนย์กลาง", "外徑"],
        ["ความยาว", "長度"],
        ["น้ำหนัก", "重量"],
        ["ร้อน", "高溫"],
        ["เย็น", "低溫"],
        ["วัดขนาด", "量尺寸"]
      ],
      "ตัวเลข / 數字": [
        ["ศูนย์", "零 0"],
        ["หนึ่ง", "一 1"],
        ["สอง", "二 2"],
        ["สาม", "三 3"],
        ["สี่", "四 4"],
        ["ห้า", "五 5"],
        ["หก", "六 6"],
        ["เจ็ด", "七 7"],
        ["แปด", "八 8"],
        ["เก้า", "九 9"],
        ["สิบ", "十 10"]
      ]
    };

    const cats = Object.keys(DATA);
    let current = cats[0];

    function speak(text, lang) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.85;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
      if (v) u.voice = v;
      const now = document.getElementById("now");
      now.style.display = "block";
      now.textContent = (lang === "th-TH" ? "กำลังฟังไทย： " : "正在聽中文： ") + text;
      u.onend = function () { now.style.display = "none"; };
      window.speechSynthesis.speak(u);
    }

    function speakBoth(th, zh) {
      window.speechSynthesis.cancel();
      const a = new SpeechSynthesisUtterance(th);
      a.lang = "th-TH";
      a.rate = 0.85;
      const b = new SpeechSynthesisUtterance(zh);
      b.lang = "zh-TW";
      b.rate = 0.85;
      a.onend = function () { window.speechSynthesis.speak(b); };
      const now = document.getElementById("now");
      now.style.display = "block";
      now.textContent = "ไทย → จีน / 泰文再中文：" + th;
      b.onend = function () { now.style.display = "none"; };
      window.speechSynthesis.speak(a);
    }

    function renderCats() {
      const box = document.getElementById("cats");
      box.innerHTML = "";
      cats.forEach(function (c) {
        const b = document.createElement("button");
        b.textContent = c;
        if (c === current) b.className = "on";
        b.onclick = function () { current = c; renderCats(); renderList(); };
        box.appendChild(b);
      });
    }

    function renderList() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      DATA[current].forEach(function (row) {
        const th = row[0], zh = row[1];
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML =
          '<div class="th"></div><div class="zh"></div><div class="row">' +
          '<button class="speak">ฟังไทย 聽泰文</button>' +
          '<button class="speak zhbtn">ฟังจีน 聽中文</button>' +
          '<button class="speak both">ไทย+จีน 先泰後中</button></div>';
        div.querySelector(".th").textContent = th;
        div.querySelector(".zh").textContent = zh;
        const btns = div.querySelectorAll("button");
        btns[0].onclick = function () { speak(th, "th-TH"); };
        btns[1].onclick = function () { speak(zh, "zh-TW"); };
        btns[2].onclick = function () { speakBoth(th, zh); };
        list.appendChild(div);
      });
    }

    window.speechSynthesis.onvoiceschanged = function () {};
    renderCats();
    renderList();
  </script>
</body>
</html>
