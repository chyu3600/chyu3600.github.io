<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฟังแล้วเรียน — 邊聽邊學</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffdf8;
      --line: #d9cbb0;
      --text: #1f2430;
      --muted: #5c6573;
      --th: #0b5c3a;
      --zh: #0b3d5c;
      --btn: #c9a227;
      --btn-text: #1a1200;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans Thai", "Noto Sans TC", "Sarabun", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    header { margin-bottom: 16px; }
    h1 { font-size: 22px; }
    header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }
    .cats button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .cats button.on {
      background: var(--btn);
      border-color: var(--btn);
      color: var(--btn-text);
      font-weight: 700;
    }
    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .th {
      font-size: 22px;
      font-weight: 700;
      color: var(--th);
      line-height: 1.4;
    }
    .zh {
      font-size: 15px;
      color: var(--zh);
      margin: 4px 0 10px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button.speak {
      border: 0;
      background: var(--th);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button.speak.zhbtn { background: var(--zh); }
    button.speak.both { background: #7a4e00; }
    .custom-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .custom-box h2 {
      font-size: 15px;
      color: var(--th);
      margin-bottom: 10px;
    }
    .custom-box .inputs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .custom-box .field {
      flex: 1 1 140px;
    }
    .custom-box .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .custom-box input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
    }
    .custom-box .add-btn {
      flex: 0 0 auto;
      border: 0;
      background: var(--th);
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .translate-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.5;
      padding: 8px 10px;
      background: #f5f1e8;
      border-radius: 8px;
      border: 1px dashed var(--line);
    }
    .translate-hint b { color: var(--zh); }
    .custom-list {
      margin-top: 12px;
    }
    .custom-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #fff;
    }
    .custom-item .row { margin-top: 8px; }
    .custom-item .del {
      border: 0;
      background: #e05a5a;
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .now {
      position: sticky;
      bottom: 12px;
      background: #1c2430;
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ฟังแล้วเรียน / 邊聽邊學</h1>
      <p>กดปุ่มเพื่อฟังภาษาไทยหรือภาษาจีน · 點按鈕聽泰文或中文</p>
    </header>
    <div class="cats" id="cats"></div>
    <div class="custom-box">
      <h2>➕ เพิ่มคำใหม่ / 加入自訂詞</h2>
      <div class="inputs">
        <div class="field">
          <label>ภาษาจีน / 中文（你只會中文，填這裡）</label>
          <input id="inpZh" placeholder="如：你好、主管、鋼" oninput="translateToThai()" />
        </div>
        <div class="field">
          <label>ไทย / 泰文（自動翻譯，可手動改）</label>
          <input id="inpTh" placeholder="填中文後自動出現" />
        </div>
        <button class="add-btn" onclick="addCustom()">新增</button>
      </div>
      <div class="translate-hint" id="transHint" style="display:none;">⏳ 翻譯中… /กำลังแปล…</div>
      <div class="custom-list" id="customList"></div>
    </div>
    <div id="list"></div>
    <div class="now" id="now"></div>
  </div>
  <script>
    const DATA = {
      "ทักทาย / 打招呼": [
        ["สวัสดีครับ", "你好（男）"],
        ["สวัสดีค่ะ", "你好（女）"],
        ["ขอบคุณครับ", "謝謝（男）"],
        ["ขอบคุณค่ะ", "謝謝（女）"],
        ["ขอโทษครับ", "對不起"],
        ["ครับ / ค่ะ", "是的 / 好的"],
        ["ไม่เป็นไร", "沒關係"],
        ["ลาก่อน", "再見"]
      ],
      "โรงงาน / 工廠": [
        ["ไปทำงาน", "去上班"],
        ["เลิกงาน", "下班"],
        ["เข้างานตรงเวลา", "準時上班"],
        ["หัวหน้างาน", "主管"],
        ["เพื่อนร่วมงาน", "同事"],
        ["ห้องน้ำอยู่ที่ไหน", "廁所在哪裡"],
        ["โรงอาหาร", "餐廳"],
        ["พักเบรก", "休息"]
      ],
      "ความปลอดภัย / 安全": [
        ["สวมหมวกนิรภัย", "戴安全帽"],
        ["สวมรองเท้าเซฟตี้", "穿安全鞋"],
        ["ระวังร้อน", "小心燙"],
        ["ระวังหนีบ", "小心夾手"],
        ["หยุดเครื่อง", "停機"],
        ["เหตุฉุกเฉิน", "緊急狀況"],
        ["ปฐมพยาบาล", "急救"],
        ["ทางหนีไฟ", "逃生通道"]
      ],
      "งานตีเหล็ก / 鍛造": [
        ["เหล็ก", "鋼"],
        ["เหล็กกล้าคาร์บอน", "碳鋼"],
        ["เส้นผ่านศูนย์กลาง", "外徑"],
        ["ความยาว", "長度"],
        ["น้ำหนัก", "重量"],
        ["ร้อน", "高溫"],
        ["เย็น", "低溫"],
        ["วัดขนาด", "量尺寸"]
      ],
      "ตัวเลข / 數字": [
        ["ศูนย์", "零 0"],
        ["หนึ่ง", "一 1"],
        ["สอง", "二 2"],
        ["สาม", "三 3"],
        ["สี่", "四 4"],
        ["ห้า", "五 5"],
        ["หก", "六 6"],
        ["เจ็ด", "七 7"],
        ["แปด", "八 8"],
        ["เก้า", "九 9"],
        ["สิบ", "十 10"]
      ]
    };

    const cats = Object.keys(DATA);
    let current = cats[0];

    function speak(text, lang) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.85;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
      if (v) u.voice = v;
      const now = document.getElementById("now");
      now.style.display = "block";
      now.textContent = (lang === "th-TH" ? "กำลังฟังไทย： " : "正在聽中文： ") + text;
      u.onend = function () { now.style.display = "none"; };
      window.speechSynthesis.speak(u);
    }

    function speakBoth(th, zh) {
      window.speechSynthesis.cancel();
      const a = new SpeechSynthesisUtterance(th);
      a.lang = "th-TH";
      a.rate = 0.85;
      const b = new SpeechSynthesisUtterance(zh);
      b.lang = "zh-TW";
      b.rate = 0.85;
      const now = document.getElementById("now");
      now.style.display = "block";
      now.textContent = "ไทย → 中文 / 泰文再中文：" + th;
      a.onend = function () {
        now.textContent = "ไทย → 中文 / 泰文再中文：" + zh;
        window.speechSynthesis.speak(b);
      };
      b.onend = function () { now.style.display = "none"; };
      window.speechSynthesis.speak(a);
    }

    function renderCats() {
      const box = document.getElementById("cats");
      box.innerHTML = "";
      cats.forEach(function (c) {
        const b = document.createElement("button");
        b.textContent = c;
        if (c === current) b.className = "on";
        b.onclick = function () { current = c; renderCats(); renderList(); };
        box.appendChild(b);
      });
    }

    function renderList() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      DATA[current].forEach(function (row) {
        const th = row[0], zh = row[1];
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML =
          '<div class="th"></div><div class="zh"></div><div class="row">' +
          '<button class="speak">ฟังไทย 聽泰文</button>' +
          '<button class="speak zhbtn">ฟังจีน 聽中文</button>' +
          '<button class="speak both">ไทย+จีน 先泰後中</button></div>';
        div.querySelector(".th").textContent = th;
        div.querySelector(".zh").textContent = zh;
        const btns = div.querySelectorAll("button");
        btns[0].onclick = function () { speak(th, "th-TH"); };
        btns[1].onclick = function () { speak(zh, "zh-TW"); };
        btns[2].onclick = function () { speakBoth(th, zh); };
        list.appendChild(div);
      });
    }

    // ── 中文 → 泰文 自動翻譯（Agnes API）──
    const AGNES_KEY = "sk-LR1IvLKTFcl7nb2r2hWLwjubblVZHeDQM8B92jWzivYBS3PP";
    const AGNES_URL = "https://apihub.agnes-ai.com/v1/chat/completions";
    let transTimer = null;

    function translateToThai() {
      const zh = document.getElementById("inpZh").value.trim();
      const hint = document.getElementById("transHint");
      const thField = document.getElementById("inpTh");
      if (!zh) { thField.value = ""; hint.style.display = "none"; return; }
      // 防抖：停止輸入後 600ms 才呼叫
      clearTimeout(transTimer);
      hint.style.display = "block";
      hint.textContent = "⏳ 翻譯中…";
      transTimer = setTimeout(function () {
        fetch(AGNES_URL, {
          method: "POST",
          headers: { "Authorization": "Bearer " + AGNES_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "agnes-2.5-flash",
            messages: [
              {
                role: "system",
                content: "你是中泰文翻譯器。使用者會輸入中文，你只輸出對應的泰文單字或短語（1-3個字），不要解釋、不要其他文字。"
              },
              { role: "user", content: zh }
            ],
            temperature: 0.2,
            max_tokens: 500
          })
        }).then(function (r) { return r.json(); })
          .then(function (d) {
            const m = d.choices && d.choices[0] && d.choices[0].message;
            const th = (m ? (m.content || m.reasoning_content || "").trim() : "").trim();
            thField.value = th;
            hint.style.display = "none";
          })
          .catch(function () {
            hint.textContent = "⚠️ 翻譯失敗，請手動輸入泰文 / แปลล้มเหลว";
          });
      }, 600);
    }

    // ── 自訂詞（localStorage 持久化）──
    let CUSTOM = [];
    try {
      const saved = localStorage.getItem("thai_custom_words");
      if (saved) CUSTOM = JSON.parse(saved);
    } catch (e) { CUSTOM = []; }

    function saveCustom() {
      localStorage.setItem("thai_custom_words", JSON.stringify(CUSTOM));
    }

    function addCustom() {
      const th = document.getElementById("inpTh").value.trim();
      const zh = document.getElementById("inpZh").value.trim();
      if (!th || !zh) { alert("請同時輸入泰文和中文 / กรุณากรอกภาษาไทยและภาษาจีน"); return; }
      CUSTOM.push([th, zh]);
      saveCustom();
      document.getElementById("inpTh").value = "";
      document.getElementById("inpZh").value = "";
      renderCustom();
    }

    function delCustom(i) {
      CUSTOM.splice(i, 1);
      saveCustom();
      renderCustom();
    }

    function renderCustom() {
      const box = document.getElementById("customList");
      box.innerHTML = "";
      if (!CUSTOM.length) {
        box.innerHTML = '<div style="color:var(--muted);font-size:13px;">尚無自訂詞 / ยังไม่มียศ</div>';
        return;
      }
      CUSTOM.forEach(function (row, i) {
        const th = row[0], zh = row[1];
        const div = document.createElement("div");
        div.className = "custom-item";
        div.innerHTML =
          '<div class="th" style="font-size:18px;"></div>' +
          '<div class="zh"></div>' +
          '<div class="row">' +
          '<button class="speak">ฟังไทย 聽泰文</button>' +
          '<button class="speak zhbtn">ฟังจีน 聽中文</button>' +
          '<button class="speak both">先泰後中</button>' +
          '<button class="del">刪除</button></div>';
        div.querySelector(".th").textContent = th;
        div.querySelector(".zh").textContent = zh;
        const btns = div.querySelectorAll("button");
        btns[0].onclick = function () { speak(th, "th-TH"); };
        btns[1].onclick = function () { speak(zh, "zh-TW"); };
        btns[2].onclick = function () { speakBoth(th, zh); };
        btns[3].onclick = function () { delCustom(i); };
        box.appendChild(div);
      });
    }

    window.speechSynthesis.onvoiceschanged = function () {};
    renderCats();
    renderList();
    renderCustom();
  </script>
</body>
</html>
